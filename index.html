<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bougainvillea &mdash; Guest Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#70235E;
  --plum-deep:#4A1740;
  --ink:#33112C;
  --crimson:#D41C5A;
  --pink:#F0649D;
  --orange:#F8981D;
  --accent:#70235E;
  --paper:#FBF7F9;
  --card:#FFFFFF;
  --line:#EADFE7;
  --plum-wash:#F3EAF1;
  --pink-wash:#FDEDF3;
  --orange-wash:#FEF2E2;
  --muted:#7C6376;
  --flag:#D41C5A;
  --amber:#A96410;
  --r:16px;
  --shadow:0 1px 2px rgba(112,35,94,.05), 0 10px 30px rgba(112,35,94,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:"Newsreader",Georgia,serif;font-weight:400;margin:0;letter-spacing:-.012em;color:var(--plum-deep)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--plum)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

.eyebrow{
  font-family:"Newsreader",Georgia,serif;
  font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--pink);font-weight:500;
}
.btn{
  border:1px solid var(--plum);background:var(--plum);color:#fff;
  border-radius:999px;padding:14px 26px;font-weight:500;font-size:15px;
  transition:transform .12s ease, opacity .12s ease;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.28;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--plum);border-color:var(--line)}
.btn.small{padding:8px 16px;font-size:13px}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:8px}

.logo-full{display:block;height:auto}
.logo-mark{display:block;flex:0 0 auto}

/* ---------- demo home ---------- */
.home{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.home-inner{max-width:560px;width:100%;text-align:center}
.home .logo-full{width:150px;margin:0 auto 22px}
.home h1{font-size:clamp(32px,7vw,44px);line-height:1.06;margin-bottom:12px}
.home p{color:var(--muted);margin:0 0 28px}
.home-grid{display:grid;gap:12px;text-align:left}
.home-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 22px;display:block;text-decoration:none;color:inherit;box-shadow:var(--shadow);
}
.home-card strong{display:block;font-size:16px;margin-bottom:4px;color:var(--plum-deep)}
.home-card span{color:var(--muted);font-size:14px}
.note{
  margin-top:26px;font-size:13px;color:var(--muted);text-align:left;
  border-left:2px solid var(--pink);padding-left:14px;
}

/* ---------- room picker ---------- */
.picker{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.picker-in{max-width:400px;width:100%}
.picker .logo-full{width:170px;margin:0 auto 26px}
.picker h1{font-size:clamp(28px,7vw,36px);line-height:1.08;margin-bottom:10px}
.picker p{color:var(--muted);font-size:15px;margin:0 0 26px}
.picker select{width:100%;padding:15px;font-size:17px;text-align:center;border-radius:12px;margin-bottom:14px}
.picker .btn{width:100%}

/* ---------- guest survey ---------- */
.g-shell{min-height:100dvh;display:flex;flex-direction:column;background:var(--paper)}
.g-top{padding:14px 20px 0;max-width:640px;margin:0 auto;width:100%}
.g-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.g-head .logo-mark{width:26px}
.g-head .nm{font-family:"Newsreader",serif;font-size:17px;color:var(--plum-deep)}
.g-head .rm{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.g-bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--crimson);width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}
.g-body{flex:1;max-width:640px;margin:0 auto;width:100%;padding:24px 20px 140px}
.g-foot{
  position:fixed;left:0;right:0;bottom:0;
  background:linear-gradient(to top,var(--paper) 62%,rgba(251,247,249,0));
  padding:18px 20px calc(18px + env(safe-area-inset-bottom));
}
.g-foot-in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center}
.g-foot .btn{flex:1;text-align:center}

.hero{padding:9vh 0 0;text-align:center}
.hero .logo-full{width:190px;margin:0 auto 28px}
.hero h1{font-size:clamp(32px,8.5vw,48px);line-height:1.04;margin:0 0 16px}
.hero p{color:var(--muted);max-width:32ch;margin:0 auto}
.room-chip{
  display:inline-flex;align-items:center;gap:8px;background:var(--plum-wash);color:var(--plum);
  border-radius:999px;padding:6px 15px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  margin-bottom:22px;font-weight:500;
}
.room-chip b{font-family:"IBM Plex Mono",monospace;letter-spacing:0;font-weight:500;font-size:13px}

.sec-head{margin-bottom:26px}
.sec-head h2{font-size:30px;line-height:1.12;margin:8px 0 6px}
.sec-head p{color:var(--muted);font-size:14px;margin:0}

.q{margin-bottom:26px}
.q-label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px}
.q-label span{font-weight:500;font-size:15px}
.q-word{font-size:12px;color:var(--pink);font-family:"IBM Plex Mono",monospace;min-height:16px}
.tide{display:flex;gap:3px}
.tide button{
  flex:1;height:54px;border:1px solid var(--line);background:var(--card);
  border-radius:4px;font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--muted);
  transition:background .18s ease,color .18s ease,border-color .18s ease;
}
.tide button:first-child{border-radius:11px 4px 4px 11px}
.tide button:last-child{border-radius:4px 11px 11px 4px}
.tide button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tide button.na{flex:0 0 auto;padding:0 14px;font-family:"Inter Tight",sans-serif;font-size:12px;border-radius:11px}
.tide button.na.on{background:var(--plum-wash);border-color:var(--pink);color:var(--plum)}

.rec-list{display:grid;gap:9px}
.rec-list button{
  text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:16px 18px;font-size:15px;
}
.rec-list button.on{border-color:var(--accent);background:var(--accent);color:#fff}

.sorry{background:var(--pink-wash);border:1px solid #F7D7E4;border-radius:var(--r);padding:20px;margin-bottom:20px}
.sorry h2{font-size:24px;line-height:1.15;margin-bottom:8px;color:var(--plum-deep)}
.sorry p{margin:0;color:var(--muted);font-size:14px}
.d-block{margin-bottom:24px}
.d-block h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-family:"Newsreader",serif;font-weight:500;color:var(--crimson);margin-bottom:4px}
.d-block .d-score{font-size:12px;color:var(--muted);margin-bottom:12px;font-family:"IBM Plex Mono",monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:9px 15px;font-size:14px;
}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;
  background:var(--card);min-height:96px;resize:vertical;
}

.thanks{padding:8vh 0 0;text-align:center}
.thanks .logo-full{width:170px;margin:0 auto 28px}
.thanks h1{font-size:clamp(30px,7.5vw,44px);line-height:1.05;margin-bottom:14px}
.thanks p{color:var(--muted);max-width:34ch;margin:0 auto}
.gbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-top:32px;box-shadow:var(--shadow)}
.gbox p{margin:0 0 16px;color:var(--ink)}
.gbox .btn{width:100%;text-align:center;background:var(--crimson);border-color:var(--crimson);display:block;text-decoration:none}
.received{
  margin-top:32px;border-left:2px solid var(--crimson);padding:2px 0 2px 16px;
  font-size:14px;color:var(--muted);text-align:left;
}

/* ---------- admin ---------- */
.a-shell{min-height:100dvh;display:flex;flex-direction:column}
.a-top{background:var(--plum);color:#fff;padding:12px 20px}
.a-top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.a-top .logo-mark{width:30px}
.a-brand{font-family:"Newsreader",serif;font-size:19px}
.a-brand small{display:block;font-family:"Newsreader",serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.62;margin-top:1px}
.a-nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.a-nav button{background:none;border:0;color:rgba(255,255,255,.66);padding:8px 13px;border-radius:8px;font-size:14px}
.a-nav button.on{background:rgba(255,255,255,.16);color:#fff}
.a-main{flex:1;max-width:1120px;margin:0 auto;width:100%;padding:22px 20px 60px}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
select,input[type=date],input[type=text],input[type=password],input[type=url],input[type=number],input[type=color]{
  border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-size:14px;
}
input[type=color]{padding:4px;height:38px;width:52px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.kpi .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.kpi .v{font-family:"IBM Plex Mono",monospace;font-size:27px;margin-top:6px;line-height:1;color:var(--plum-deep)}
.kpi .s{font-size:12px;color:var(--muted);margin-top:5px}
.kpi.warn .v{color:var(--crimson)}

.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.panel h3{font-size:18px;margin-bottom:2px}
.panel .sub{font-size:12px;color:var(--muted);margin-bottom:16px}

.brow{display:grid;grid-template-columns:64px 1fr 52px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}
.brow .track{height:9px;background:var(--plum-wash);border-radius:5px;overflow:hidden}
.brow .track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.brow .track i.low{background:var(--crimson)}
.brow .n{text-align:right;font-family:"IBM Plex Mono",monospace;color:var(--muted)}
.brow .k{color:var(--muted)}

.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
@media(max-width:640px){.cat-grid{grid-template-columns:1fr}}
.cat{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.cat:last-child{border-bottom:0}
.cat b{font-family:"IBM Plex Mono",monospace;font-weight:500}
.cat b.low{color:var(--crimson)}
.cat-group{font-family:"Newsreader",serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);font-weight:500;margin:16px 0 4px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 10px 10px 0;border-bottom:1px solid var(--line)}
td{padding:12px 10px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--plum-wash)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.pill.open{background:var(--pink-wash);color:var(--crimson)}
.pill.prog{background:var(--orange-wash);color:var(--amber)}
.pill.res{background:var(--plum-wash);color:var(--plum)}
.pill.closed{background:var(--paper);color:var(--muted)}
.score{font-family:"IBM Plex Mono",monospace;font-weight:500}
.score.bad{color:var(--crimson)}

.empty{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}

.sheet-bg{position:fixed;inset:0;background:rgba(51,17,44,.42);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--paper);width:min(520px,100%);overflow-y:auto;padding:22px 22px 60px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}
.sheet h2{font-size:24px;line-height:1.15}
.sheet .close{background:var(--card);border:1px solid var(--line);border-radius:999px;width:34px;height:34px;flex:0 0 auto}
.dl{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:14px;margin-bottom:20px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.field select,.field input,.field textarea{width:100%}

.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px}
.qr-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.qr-item .box{display:flex;justify-content:center;margin-bottom:10px}
.qr-item .box img,.qr-item .box canvas{width:100%;height:auto;max-width:130px}
.qr-item .rm{font-family:"IBM Plex Mono",monospace;font-size:14px;margin-bottom:8px;color:var(--plum-deep)}

.rep-head{border-bottom:2px solid var(--plum);padding-bottom:14px;margin-bottom:22px;display:flex;align-items:flex-start;gap:14px}
.rep-head .logo-mark{width:34px}
.rep-head h2{font-size:25px}
.rep-head .sub{font-size:13px;color:var(--muted);margin-top:4px}
.rep-sec{margin-bottom:26px}
.rep-sec h4{font-family:"Newsreader",serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);margin:0 0 10px;font-weight:500}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--plum-deep);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;z-index:60;box-shadow:var(--shadow)}

.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:32px;width:min(400px,100%);box-shadow:var(--shadow);text-align:center}
.login-card .logo-full{width:150px;margin:0 auto 24px}
.login-card h1{font-size:26px;margin-bottom:6px}
.login-card p{color:var(--muted);font-size:14px;margin:0 0 22px}
.login-card .field{text-align:left}
.login-card .btn{width:100%;margin-top:6px}
.err{color:var(--crimson);font-size:13px;margin-top:10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  .a-top,.filters,.noprint{display:none!important}
  body{background:#fff}
  .a-main{padding:0;max-width:none}
  .panel,.kpi{border:1px solid #ccc;box-shadow:none;break-inside:avoid}
}</style>
</head>

const CONFIG = {
  supabaseUrl:     'PASTE_YOUR_SUPABASE_URL',      // e.g. https://abcdefgh.supabase.co
  supabaseAnonKey: 'PASTE_YOUR_SUPABASE_ANON_KEY'
};
const CONFIGURED = !CONFIG.supabaseUrl.startsWith('PASTE_');

/* thin REST wrapper — no SDK, no build step */
const SB = {
  token:null,
  _store(t){ this.token=t; try{ t ? sessionStorage.setItem('bv_tok',t) : sessionStorage.removeItem('bv_tok'); }catch(e){} },
  restore(){ try{ this.token = sessionStorage.getItem('bv_tok'); }catch(e){ this.token=null; } return this.token; },
  headers(){
    return {'apikey':CONFIG.supabaseAnonKey,
            'Authorization':'Bearer '+(this.token||CONFIG.supabaseAnonKey),
            'Content-Type':'application/json'};
  },
  async req(path, opts={}){
    const r = await fetch(CONFIG.supabaseUrl+path, Object.assign({headers:this.headers()}, opts));
    const text = await r.text();
    if(!r.ok) throw new Error(text || ('HTTP '+r.status));
    return text ? JSON.parse(text) : null;
  },
  get(q){ return this.req('/rest/v1/'+q); },
  post(q, body){ return this.req('/rest/v1/'+q, {method:'POST', headers:Object.assign(this.headers(),{Prefer:'return=representation'}), body:JSON.stringify(body)}); },
  /* used by the guest survey: anon can insert but not read back, so ask for nothing in return */
  postQuiet(q, body){ return this.req('/rest/v1/'+q, {method:'POST', headers:Object.assign(this.headers(),{Prefer:'return=minimal'}), body:JSON.stringify(body)}); },
  patch(q, body){ return this.req('/rest/v1/'+q, {method:'PATCH', headers:Object.assign(this.headers(),{Prefer:'return=representation'}), body:JSON.stringify(body)}); },
  async signIn(email, password){
    const r = await fetch(CONFIG.supabaseUrl+'/auth/v1/token?grant_type=password', {
      method:'POST', headers:{'apikey':CONFIG.supabaseAnonKey,'Content-Type':'application/json'},
      body:JSON.stringify({email, password})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error_description || d.msg || 'Sign-in failed');
    this._store(d.access_token);
    return d;
  },
  signOut(){ this._store(null); }
};

/* row <-> app object mapping */
const mapSurvey = r => ({
  id:r.id, room:r.room, at:r.at, recommendation:r.recommendation, comments:r.comments||'',
  avg:r.avg, hasLow:r.has_low, ratings:{}
});
const mapIssue = r => ({
  id:r.id, surveyId:r.survey_id, room:r.room, department:r.department, category:r.category,
  tags:r.tags||[], otherText:r.other_text||'', rating:r.rating, at:r.at,
  status:r.status, assignedTo:r.assigned_to||'', notes:r.notes||'', resolvedAt:r.resolved_at
});
const mapSettings = r => ({
  resortName:r.resort_name, logo:r.logo_url||'', googleReviewUrl:r.google_review_url||'',
  brandColour:r.brand_colour, surveyLength:r.survey_length, lowThreshold:r.low_threshold,
  resolutionTargetHrs:r.resolution_target_hrs, reportTime:r.report_time, baseUrl:r.base_url||''
});

const DB = {
  settings:{
    resortName:'Bougainvillea',
    logo:'',
    googleReviewUrl:'',
    brandColour:'#70235E',
    surveyLength:'short',
    lowThreshold:3,
    resolutionTargetHrs:2,
    reportTime:'21:00',
    baseUrl:location.origin
  },
  surveys:[], issues:[], loaded:false,

  async loadSettings(){
    if(!CONFIGURED) return;
    const rows = await SB.get('settings?id=eq.1&select=*');
    if(rows && rows[0]) Object.assign(this.settings, mapSettings(rows[0]));
    if(!this.settings.baseUrl) this.settings.baseUrl = location.origin;
  },
  async saveSettings(){
    const s = this.settings;
    await SB.patch('settings?id=eq.1', {
      resort_name:s.resortName, logo_url:s.logo, google_review_url:s.googleReviewUrl,
      brand_colour:s.brandColour, survey_length:s.surveyLength, low_threshold:s.lowThreshold,
      resolution_target_hrs:s.resolutionTargetHrs, report_time:s.reportTime, base_url:s.baseUrl
    });
  },
  async loadAll(force){
    if(this.loaded && !force) return;
    const [sv, rt, is] = await Promise.all([
      SB.get('surveys?select=*&order=at.desc&limit=10000'),
      SB.get('survey_ratings?select=*&limit=200000'),
      SB.get('issues?select=*&order=at.desc&limit=10000')
    ]);
    const byId = {};
    this.surveys = sv.map(r=>{ const s=mapSurvey(r); byId[s.id]=s; return s; });
    rt.forEach(r=>{ if(byId[r.survey_id]) byId[r.survey_id].ratings[r.item] = r.score; });
    this.issues = is.map(mapIssue);
    this.loaded = true;
  },

  /* guest submit — survey row, its ratings, then any issues.
     The id is minted here because an anonymous insert cannot read the row back. */
  async submit(payload){
    const sid = (crypto.randomUUID ? crypto.randomUUID()
                 : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
                     const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }));
    const at = new Date().toISOString();
    await SB.postQuiet('surveys', {
      id:sid, room:payload.room, at, recommendation:payload.recommendation,
      comments:payload.comments, avg:payload.avg, has_low:payload.lows.length>0
    });
    const ratingRows = Object.entries(payload.ratings)
      .filter(([k,v])=>v!=='NA')
      .map(([k,v])=>({survey_id:sid, item:k, department:ITEM[k].dept, score:v}));
    if(ratingRows.length) await SB.postQuiet('survey_ratings', ratingRows);
    if(payload.lows.length){
      await SB.postQuiet('issues', payload.lows.map(l=>({
        survey_id:sid, room:payload.room, department:ITEM[l.id].dept, category:ITEM[l.id].label,
        tags:payload.details[l.id]||[], other_text:payload.otherText[l.id]||'',
        rating:l.rating, at, status:'Open'
      })));
    }
    return sid;
  },

  async updateIssue(id, patch){
    const i = this.issues.find(x=>x.id===id);
    const body = {status:patch.status, assigned_to:patch.assignedTo, notes:patch.notes};
    if((patch.status==='Resolved'||patch.status==='Closed') && !(i&&i.resolvedAt)) body.resolved_at = new Date().toISOString();
    if(patch.status==='Open'||patch.status==='In Progress') body.resolved_at = null;
    const [row] = await SB.patch('issues?id=eq.'+encodeURIComponent(id), body);
    if(i) Object.assign(i, mapIssue(row));
  },

  rooms(){
    return [...new Set(this.surveys.map(s=>s.room))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  }
};

function route(){
  /* supports clean paths (/survey?room=101, /admin) and hash paths (#/survey?room=101) */
  if(location.hash.length>1){
    const [path, qs] = location.hash.slice(1).split('?');
    return {path, q:new URLSearchParams(qs||'')};
  }
  let path = location.pathname.replace(/index\.html$/,'').replace(/\/+$/,'') || '/';
  return {path, q:new URLSearchParams(location.search)};
}

}

const admin = { auth:false, view:'dashboard', range:'7d', from:'', to:'', dept:'all',
                trend:'day', openIssue:null, openRoom:null, repFrom:'', repTo:'', repRun:false, settingsTab:'general' };

function rangeBounds(key, from, to){
  const now=new Date(); const s=new Date(now); const e=new Date(now);
  s.setHours(0,0,0,0); e.setHours(23,59,59,999);
  if(key==='yesterday'){ s.setDate(s.getDate()-1); e.setDate(e.getDate()-1); }
  else if(key==='7d'){ s.setDate(s.getDate()-6); }
  else if(key==='30d'){ s.setDate(s.getDate()-29); }
  else if(key==='month'){ s.setDate(1); }
  else if(key==='prevmonth'){ s.setMonth(s.getMonth()-1,1); e.setDate(0); e.setHours(23,59,59,999); }
  else if(key==='custom'){
    if(from){ const f=new Date(from); f.setHours(0,0,0,0); s.setTime(f.getTime()); }
    if(to){ const t=new Date(to); t.setHours(23,59,59,999); e.setTime(t.getTime()); }
  }
  return [s,e];
}
function rangeLabel(){
  const [s,e]=rangeBounds(admin.range, admin.from, admin.to);
  const map={today:'Today',yesterday:'Yesterday','7d':'Last 7 days','30d':'Last 30 days',month:'This month',prevmonth:'Previous month',custom:'Custom range'};
  return map[admin.range] + ' \u00b7 ' + fmtDate(s) + ' \u2013 ' + fmtDate(e);
}
function inRange(iso, key, from, to){
  const [s,e]=rangeBounds(key, from, to); const d=new Date(iso);
  return d>=s && d<=e;
}
function deptOf(itemId){ return ITEM[itemId] ? ITEM[itemId].dept : 'General'; }

function slice(key=admin.range, from=admin.from, to=admin.to, dept=admin.dept){
  let surveys = DB.surveys.filter(s=>inRange(s.at,key,from,to));
  let issues  = DB.issues .filter(i=>inRange(i.at,key,from,to));
  if(dept!=='all'){
    surveys = surveys.filter(s=>Object.keys(s.ratings).some(k=>deptOf(k)===dept && s.ratings[k]!=='NA'));
    issues  = issues.filter(i=>i.department===dept);
  }
  const rows=[];
  surveys.forEach(s=>Object.entries(s.ratings).forEach(([k,v])=>{
    if(v==='NA') return;
    if(dept!=='all' && deptOf(k)!==dept) return;
    rows.push({surveyId:s.id, room:s.room, at:s.at, item:k, dept:deptOf(k), v});
  }));
  return {surveys, issues, rows};
}

function stats(sl){
  const {surveys, issues, rows} = sl;
  const scores = rows.map(r=>r.v);
  const dist = [1,2,3,4,5].map(n=>scores.filter(v=>v===n).length);
  const total = scores.length || 1;
  const resolvedIssues = issues.filter(i=>i.resolvedAt);
  const resTimes = resolvedIssues.map(i=>(new Date(i.resolvedAt)-new Date(i.at))/36e5);
  const yes = surveys.filter(s=>s.recommendation==='Definitely Yes'||s.recommendation==='Probably Yes').length;
  return {
    surveys:surveys.length,
    avg: avgOf(scores),
    lowCount: scores.filter(v=>v<=DB.settings.lowThreshold).length,
    open: issues.filter(i=>i.status==='Open').length,
    prog: issues.filter(i=>i.status==='In Progress').length,
    resolved: issues.filter(i=>i.status==='Resolved').length,
    closed: issues.filter(i=>i.status==='Closed').length,
    issues: issues.length,
    avgRes: avgOf(resTimes),
    recPct: surveys.length ? Math.round(yes/surveys.length*100) : null,
    dist, distPct: dist.map(d=>Math.round(d/total*100))
  };
}

function buildTrend(surveys, mode){
  const buckets = {};
  surveys.forEach(s=>{
    const d=new Date(s.at); let k;
    if(mode==='day') k = d.toISOString().slice(0,10);
    else if(mode==='week'){ const t=new Date(d); t.setDate(t.getDate()-((t.getDay()+6)%7)); k=t.toISOString().slice(0,10); }
    else k = d.toISOString().slice(0,7);
    (buckets[k]=buckets[k]||[]).push(s.avg);
  });
  return Object.keys(buckets).sort().map(k=>({k, v:avgOf(buckets[k])}));
}
function trendSvg(pts){
  if(pts.length<2) return '<div class="empty">Not enough data in this range to draw a trend.</div>';
  const W=100, H=34, min=3, max=5;
  const x=i=>i/(pts.length-1)*W;
  const y=v=>H-((v-min)/(max-min))*H;
  const line = pts.map((p,i)=>`${x(i).toFixed(2)},${y(Math.max(min,Math.min(max,p.v))).toFixed(2)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H+6}" preserveAspectRatio="none" style="width:100%;height:150px;margin-top:8px" role="img" aria-label="Average rating trend">
    <line x1="0" y1="${y(4).toFixed(2)}" x2="${W}" y2="${y(4).toFixed(2)}" stroke="var(--line)" stroke-width=".3"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width=".9" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)" class="mono">
    <span>${esc(pts[0].k)}</span><span>4.0 guide line</span><span>${esc(pts[pts.length-1].k)}</span>
  </div>`;
}

function exportCsv(){
  const sl = slice('custom', admin.repFrom, admin.repTo, 'all');
  const cols = ['Survey ID','Room','Date','Time','Recommendation','Average','Comments',
    ...Object.keys(ITEM).map(k=>ITEM[k].label)];
  const lines = [cols];
  sl.surveys.forEach(s=>{
    lines.push([s.id, s.room, new Date(s.at).toLocaleDateString('en-IN'), fmtTime(s.at),
      s.recommendation, s.avg, s.comments, ...Object.keys(ITEM).map(k=>s.ratings[k]??'')]);
  });
  const csv = lines.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  const a=document.createElement('a'); a.href=url; a.download=`guest-feedback-${admin.repFrom}-to-${admin.repTo}.csv`; a.click();
  URL.revokeObjectURL(url); toast('CSV exported');
}

        const m=part.match(/^(\d+)\s*-\s*(\d+)$/);
        if(m){ for(let i=+m[1];i<=+m[2];i++) rooms.push(String(i)); }
        else rooms.push(part);
      });
      grid.innerHTML='';
      if(typeof QRCode === 'undefined'){
        grid.innerHTML='<div class="empty">QR library didn\u2019t load \u2014 check the network connection and reload.</div>';
        return;
      }
      rooms.forEach(r=>{
        const url = DB.settings.baseUrl.replace(/\/+$/,'') + '/?room=' + encodeURIComponent(r);
        const item=document.createElement('div'); item.className='qr-item';
        item.innerHTML=`<div class="box"></div><div class="rm">Room ${esc(r)}</div><button class="btn small ghost">Download</button>`;
        grid.appendChild(item);
        new QRCode($('.box',item), {text:url, width:260, height:260, colorDark:'#10302F', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M});
        $('button',item).addEventListener('click',()=>{
          const cv=$('canvas',item), im=$('img',item);
          const href = cv ? cv.toDataURL('image/png') : (im?im.src:null);
          if(!href) return toast('Could not export that code');
          const a=document.createElement('a'); a.href=href; a.download=`qr-room-${r}.png`; a.click();
        });
      });
    };
    $('#qgen',out).addEventListener('click',gen);
    gen();
  }
}

/* =========================================================================
   6. HOME + ROUTER
   ========================================================================= */
function renderSetupNotice(){
  app.innerHTML = `<div class="picker"><div class="picker-in">
    ${imgFull()}
    <span class="eyebrow">Setup required</span>
    <h1>Not connected yet</h1>
    <p>Open <span class="mono">index.html</span>, paste your Supabase project URL and anon key into the CONFIG block at the top, then redeploy.</p>
  </div></div>`;
}

async function render(){
  if(!CONFIGURED) return renderSetupNotice();
  const {path, q} = route();
  if(path==='/admin'){
    if(!admin.auth && SB.restore()) admin.auth = true;
    try{ await loadSettingsOnce(); }catch(e){ console.error(e); }
    return renderAdmin();
  }
  try{ await loadSettingsOnce(); }
  catch(e){ console.error(e); }
  const room = q.get('room');
  if(!room) return renderPicker();
  if(guest.room !== room){ guest.step=-1; guest.answers={}; guest.details={}; guest.otherText={}; guest.recommendation=''; guest.comments=''; }
  renderGuest(room);
}
let _settingsLoaded = false;
async function loadSettingsOnce(){
  if(_settingsLoaded) return;
  await DB.loadSettings();
  _settingsLoaded = true;
}
window.addEventListener('hashchange', render);
window.addEventListener('popstate', render);
render();
</script>
